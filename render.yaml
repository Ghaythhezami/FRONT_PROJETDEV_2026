# Render Blueprint — branch: adjusted-backend
# Uses Neon PostgreSQL (set ConnectionStrings__Connection in dashboard).

services:
  - type: web
    name: agile-ai-api
    runtime: docker
    repo: https://github.com/Ghaythhezami/projetDev2026
    branch: adjusted-backend
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Secret
        generateValue: true
      # Paste Neon URI or Npgsql connection string in Render dashboard:
      - key: ConnectionStrings__Connection
        sync: false
      # Alternative: full postgres:// URI (auto-converted on startup)
      - key: DATABASE_URL
        sync: false
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Cloudinary__Folder
        value: agile-ai
      - key: Cors__AllowedOrigins__0
        sync: false
