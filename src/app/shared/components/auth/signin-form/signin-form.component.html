<div class="signin-animate flex flex-col justify-center flex-1 w-full max-w-md mx-auto px-1">
  <div>
    <div class="mb-8">
      <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-brand-500">AgileAi</p>
      <h1 class="mb-2 text-2xl font-bold text-gray-900 dark:text-white/90 sm:text-3xl">
        Welcome back
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Sign in to manage sprints, backlogs, and AI-assisted delivery.
      </p>
    </div>

    <form (ngSubmit)="onSignIn()" class="space-y-5">
      <div>
        <app-label>Email <span class="text-error-500">*</span></app-label>
        <app-input-field
          type="email"
          placeholder="you@company.com"
          [value]="email"
          (valueChange)="email = $event.toString()"
          name="email"
          class="form-input"
        />
      </div>

      <div>
        <app-label>Password <span class="text-error-500">*</span></app-label>
        <div class="relative">
          <app-input-field
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter your password"
            [value]="password"
            (valueChange)="password = $event.toString()"
            name="password"
            class="form-input"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute z-30 -translate-y-1/2 cursor-pointer right-4 top-1/2 text-gray-400 hover:text-gray-600"
            aria-label="Toggle password visibility"
          >
            @if (showPassword) { 👁 } @else { 👁‍🗨 }
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <app-checkbox [(checked)]="isChecked" label="Keep me logged in" />
      </div>

      @if (errorMessage) {
        <div class="rounded-xl border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-600 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-400">
          {{ errorMessage }}
        </div>
      }

      <app-ui-button type="submit" className="w-full" [loading]="isLoading" [disabled]="isLoading">
        {{ isLoading ? 'Signing in…' : 'Sign in' }}
      </app-ui-button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
      Don't have an account?
      <a routerLink="/signup" class="font-medium text-brand-500 hover:text-brand-600">Sign up</a>
    </p>
  </div>
</div>
