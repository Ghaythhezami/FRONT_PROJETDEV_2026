<div class="space-y-6">
  <app-page-breadcrumb pageTitle="Notifications" />
  <h1 class="text-2xl font-semibold text-gray-800 dark:text-white/90">Notifications</h1>

  @if (actionMessage()) {
    <p class="text-sm text-brand-600">{{ actionMessage() }}</p>
  }

  <div class="grid gap-6 lg:grid-cols-2">
    <form class="rounded-xl border border-gray-200 p-5 space-y-3 dark:border-white/[0.05]" (ngSubmit)="sendNotification()">
      <h2 class="font-semibold">Send notification</h2>
      <input class="w-full rounded-lg border px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900" placeholder="Receiver user ID (UUID)" [(ngModel)]="sendForm.receiverId" name="receiverId" required />
      <textarea class="w-full rounded-lg border px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900" placeholder="Message" [(ngModel)]="sendForm.description" name="desc"></textarea>
      <input class="w-full rounded-lg border px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900" placeholder="Link (optional)" [(ngModel)]="sendForm.link" name="link" />
      <button type="submit" class="rounded-lg bg-brand-500 px-4 py-2 text-sm text-white">Send</button>
    </form>
    <form class="rounded-xl border border-gray-200 p-5 space-y-3 dark:border-white/[0.05]" (ngSubmit)="sendTest()">
      <h2 class="font-semibold">Test notification</h2>
      <input class="w-full rounded-lg border px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900" placeholder="Receiver user ID" [(ngModel)]="testForm.receiverId" name="testReceiver" required />
      <textarea class="w-full rounded-lg border px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-900" placeholder="Description" [(ngModel)]="testForm.description" name="testDesc"></textarea>
      <button type="submit" class="rounded-lg border px-4 py-2 text-sm">Send test</button>
    </form>
  </div>

  <div class="rounded-xl border border-gray-200 dark:border-white/[0.05] dark:bg-white/[0.03]">
    <ul class="divide-y dark:divide-white/[0.05]">
      @for (n of store.items(); track n.notificationId) {
        <li class="flex items-start justify-between gap-4 px-5 py-4" [class.opacity-60]="n.isRead">
          <div>
            <p class="text-sm">{{ n.message }}</p>
            @if (n.link) { <a [href]="n.link" class="text-xs text-brand-600">{{ n.link }}</a> }
            <p class="text-xs text-gray-500">{{ n.createdAt | date: 'medium' }}</p>
          </div>
          @if (!n.isRead) {
            <button type="button" class="text-xs text-brand-600" (click)="markRead(n)">Mark read</button>
          }
        </li>
      }
    </ul>
    <div appInfiniteScroll [appInfiniteScrollDisabled]="!store.hasMore()" (appInfiniteScroll)="store.loadMore()"></div>
    <app-load-more-footer [loading]="store.loadingMore()" [hasMore]="store.hasMore()" [shown]="store.items().length" [total]="store.total()" (loadMore)="store.loadMore()" />
  </div>
</div>
